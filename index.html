<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HOTEL NOIR — フロント シフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ===== SPLASH ===== */
#splash{position:fixed;inset:0;z-index:9999;background:#0E0E0C;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
#splash.hide{animation:splashOut 1.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes splashOut{0%{opacity:1;transform:scale(1)}40%{opacity:1;transform:scale(1.018)}100%{opacity:0;transform:scale(1.04)}}
.spl-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,#B8A98A 30%,#B8A98A 70%,transparent);transform:scaleX(0);transform-origin:center;animation:lineWipe 1s ease forwards .2s}
.spl-line.top{top:0}.spl-line.bot{bottom:0}
@keyframes lineWipe{to{transform:scaleX(1)}}
.spl-logo{width:clamp(200px,50vw,360px);opacity:0;animation:logoIn 1.2s cubic-bezier(.2,0,.2,1) forwards .6s;filter:drop-shadow(0 0 40px rgba(184,169,138,.12));position:relative;z-index:1}
@keyframes logoIn{0%{opacity:0;transform:translateY(14px) scale(.94)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
.spl-shimmer{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);transform:translateX(-100%);animation:shimmer 1.6s ease forwards 1.4s;z-index:2}
@keyframes shimmer{to{transform:translateX(200%)}}
.spl-sub{font-family:'Noto Sans JP',sans-serif;font-size:9px;letter-spacing:.5em;color:#3A3830;text-transform:uppercase;opacity:0;margin-top:22px;animation:fadeUp .8s ease forwards 1.2s;z-index:1}
#splash::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.045'/%3E%3C/svg%3E");background-size:180px;opacity:.5}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== BASE ===== */
body{font-family:'Noto Sans JP',-apple-system,sans-serif;background:#F5F4F0;min-height:100vh;}

.app{max-width:980px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}

/* ===== HEADER ===== */
.hdr{background:#2C2C2A;border-radius:12px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-title{font-size:15px;font-weight:700;color:#F1EFE8;letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;color:#B4B2A9}
.legpill{height:9px;width:22px;border-radius:2px}
.save-pill{font-size:10px;padding:3px 9px;border-radius:20px;background:#3A3A38;color:#B4B2A9;transition:all .3s;white-space:nowrap}
.save-pill.ok{background:#0F3D2E;color:#6DCFAB}
.print-btn{font-size:10px;padding:4px 12px;border-radius:6px;border:1px solid #B8A98A44;background:transparent;color:#B8A98A;cursor:pointer;letter-spacing:.04em}
.print-btn:hover{background:#B8A98A22}

/* ===== MODE TABS ===== */
.mode-tabs{display:flex;background:#fff;border-radius:10px;border:1px solid #D3D1C7;overflow:hidden}
.mode-tab{flex:1;padding:10px 8px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;color:#888780;transition:all .15s;border:none;background:transparent}
.mode-tab.active{background:#2C2C2A;color:#F1EFE8}

/* ===== CARD ===== */
.card{background:#fff;border-radius:12px;border:1px solid #D3D1C7;overflow:hidden}
.card-head{padding:11px 14px;background:#F8F7F3;border-bottom:1px solid #D3D1C7;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.card-title{font-size:13px;font-weight:700;color:#2C2C2A}

/* ===== DAY TABS ===== */
.day-tabs{display:flex;gap:5px;padding:10px 14px;border-bottom:1px solid #D3D1C7;flex-wrap:wrap;background:#F8F7F3}
.dtab{padding:5px 13px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:600;transition:all .15s;border:1.5px solid transparent}

/* ===== SHIFT GRID ===== */
.grid-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.axis-row{display:flex;border-bottom:1px solid #D3D1C7;background:#F8F7F3;min-width:560px}
.name-col{width:110px;min-width:110px;padding:7px 10px;font-size:10px;color:#888780;border-right:1px solid #D3D1C7;flex-shrink:0}
.axis-track{flex:1;position:relative;height:30px}
.tick-label{position:absolute;font-size:9px;transform:translateX(-50%);top:9px;white-space:nowrap;pointer-events:none;color:#888780}
.staff-row{display:flex;border-bottom:2px solid #C8C6BE;min-width:560px}
.staff-row:last-child{border-bottom:none}
.name-cell{width:110px;min-width:110px;padding:7px 10px;border-right:1px solid #D3D1C7;display:flex;flex-direction:column;justify-content:center;gap:0;flex-shrink:0}
.name-cell.working{background:#E6F1FB}
.name-cell.off{background:#FBEAF0}
.n1{font-size:10px;font-weight:600;color:#2C2C2A}
.n2{font-size:11px;font-weight:600;color:#2C2C2A}
.name-cell.working .n1,.name-cell.working .n2{color:#0C447C}
.name-cell.off .n1,.name-cell.off .n2{color:#993556}
.nbadge{font-size:8px;padding:1px 4px;border-radius:2px;background:#D3D1C7;color:#444441;margin-top:1px;display:inline-block}
.timeline{flex:1;position:relative;height:50px;background:#fff}
.bar{position:absolute;top:9px;bottom:9px;border-radius:4px;cursor:pointer;z-index:2;display:flex;align-items:center;overflow:hidden;transition:filter .15s}
.bar:hover{filter:brightness(.85)}
.blabel{font-size:9px;font-weight:600;color:#fff;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off-cell{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.off-tag{font-size:10px;font-weight:600;color:#993556;background:#FBEAF0;padding:2px 8px;border-radius:8px}
.section-div{background:#F1EFE8;border-top:1.5px solid #888780;border-bottom:1.5px solid #888780;padding:3px 10px;font-size:9px;font-weight:700;color:#5F5E5A;letter-spacing:.06em;min-width:560px}
.count-row{display:flex;border-top:2px solid #888780;background:#F8F7F3;min-width:560px}
.count-name{width:110px;min-width:110px;padding:5px 10px;font-size:9px;font-weight:600;color:#5F5E5A;border-right:1px solid #D3D1C7;display:flex;align-items:center;flex-shrink:0}
.count-track{flex:1;position:relative;height:32px}
.count-seg{position:absolute;top:5px;bottom:5px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}

/* now line */
.now-line{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A;z-index:10;pointer-events:none}
.now-line::before{content:'▼';position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:7px;color:#E24B4A;line-height:1}
.now-line-axis{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A;z-index:10;pointer-events:none}
.now-time-label{position:absolute;top:3px;font-size:8px;font-weight:700;color:#E24B4A;transform:translateX(-50%);white-space:nowrap;z-index:11;pointer-events:none;background:#F8F7F3;padding:0 2px;border-radius:2px}

/* add bar */
.add-bar{display:flex;gap:8px;padding:9px 14px;border-top:1px solid #D3D1C7;flex-wrap:wrap;align-items:center;background:#F8F7F3}
.add-bar select{font-size:11px;padding:4px 7px;border-radius:6px;border:1px solid #B4B2A9;background:#fff;color:#2C2C2A}
.add-btn{padding:5px 14px;border-radius:6px;border:1px solid #378ADD;background:#E6F1FB;color:#0C447C;font-size:11px;font-weight:600;cursor:pointer}

/* ===== MEMO ===== */
.memo-wrap{padding:10px 14px;border-top:1px solid #D3D1C7;background:#FFFDF7}
.memo-label{font-size:10px;font-weight:600;color:#888780;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.memo-label span{font-size:14px}
.memo-input{width:100%;font-size:12px;font-family:inherit;padding:8px 10px;border:1px solid #D3D1C7;border-radius:7px;background:#fff;color:#2C2C2A;resize:vertical;min-height:60px;line-height:1.5}
.memo-input:focus{outline:none;border-color:#378ADD}
.memo-count{font-size:10px;color:#B4B2A9;text-align:right;margin-top:3px}

/* ===== CALENDAR ===== */
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #D3D1C7;background:#F8F7F3}
.cal-nav{background:none;border:1px solid #D3D1C7;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px;color:#2C2C2A;font-weight:500}
.cal-nav:hover{background:#E8E6DE}
.cal-month-label{font-size:14px;font-weight:700;color:#2C2C2A}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{text-align:center;padding:7px 2px;font-size:10px;font-weight:600;color:#888780;border-bottom:1px solid #D3D1C7}
.cal-dow.sat{color:#185FA5}.cal-dow.sun{color:#A32D2D}
.cal-day{border:.5px solid #E8E6DE;min-height:48px;padding:3px;cursor:pointer;position:relative;transition:background .1s}
.cal-day:hover{background:#F8F7F3}
.cal-day.other-month{background:#FAFAF8}
.cal-day.other-month .dnum{color:#C8C6BE}
.cal-day.today{background:#FFFBF0}
.cal-day.today .dnum{font-weight:700;color:#BA7517}
.cal-day.selected{background:#E6F1FB;border-color:#378ADD}
.cal-day.has-special{background:#F0FBF6}
.cal-day.has-memo::after{content:'✏️';position:absolute;bottom:2px;right:2px;font-size:8px}
.dnum{font-size:11px;font-weight:500;color:#2C2C2A;line-height:1}
.dnum.sat{color:#185FA5}.dnum.sun,.dnum.hol{color:#A32D2D}
.hol-label{font-size:7px;color:#A32D2D;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
.sdot{width:5px;height:5px;border-radius:50%;background:#1D9E75;position:absolute;top:3px;right:3px}
.shift-mini{margin-top:2px;display:flex;flex-direction:column;gap:1px}
.shift-chip{font-size:7px;border-radius:2px;padding:1px 3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}

/* special panel head */
.sp-head{padding:10px 14px;background:#F8F7F3;border-bottom:1px solid #D3D1C7;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sp-title{font-size:13px;font-weight:700;color:#2C2C2A}
.sp-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:#E1F5EE;color:#0F6E56;font-weight:600;border:1px solid #1D9E7544}
.copy-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.copy-lbl{font-size:10px;color:#888780}
.copy-btn{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid #D3D1C7;background:#fff;cursor:pointer;color:#2C2C2A}
.copy-btn:hover{background:#F1EFE8}
.clr-btn{font-size:10px;padding:3px 9px;border-radius:5px;border:1px solid #F09595;background:#FCEBEB;color:#A32D2D;cursor:pointer}

/* ===== EDIT ===== */
.edit-head{padding:10px 14px;background:#F8F7F3;border-bottom:1px solid #D3D1C7;font-size:12px;font-weight:600;color:#5F5E5A}
.edit-body{padding:12px 14px}
.edit-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:10px;color:#5F5E5A}
.fld select{font-size:12px;padding:5px 7px;border-radius:6px;border:1px solid #B4B2A9;background:#fff;color:#2C2C2A;min-width:85px}
.dur{font-size:14px;font-weight:600;color:#2C2C2A;padding:5px 0}
.hint-txt{font-size:10px;color:#888780;margin-top:7px}
.remove-btn{padding:4px 9px;border-radius:6px;border:1px solid #F09595;background:#FCEBEB;color:#A32D2D;font-size:10px;cursor:pointer;margin-top:7px}
.typebadge{font-size:11px;font-weight:600;color:#fff;padding:4px 9px;border-radius:4px;display:inline-block}

/* ===== PRINT ===== */
@media print{
  #splash,body>*:not(.app){display:none!important}
  body{background:#fff;padding:0;opacity:1!important}
  .app{padding:0;gap:8px}
  .hdr{background:#2C2C2A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;border-radius:0}
  .mode-tabs,.add-bar,.edit-section,.print-btn,.day-tabs,.copy-row,.clr-btn,.sp-badge{display:none!important}
  .card,.shift-panel,.cal-wrap{box-shadow:none;border-radius:0;page-break-inside:avoid}
  .bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .name-cell.working,.name-cell.off{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .count-seg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .now-line,.now-line-axis,.now-time-label{display:none!important}
  .print-only{display:block!important}
  @page{margin:12mm}
}
.print-only{display:none}

/* ===== MOBILE ===== */
@media(max-width:600px){
  .app{padding:8px;gap:10px}
  .hdr{padding:10px 14px}
  .hdr-title{font-size:13px}
  .mode-tab{font-size:11px;padding:9px 4px}
  .day-tabs{gap:4px;padding:8px 10px}
  .dtab{padding:5px 10px;font-size:11px}
  .cal-day{min-height:40px}
  .dnum{font-size:10px}
  .name-cell,.name-col{width:90px;min-width:90px}
  .grid-wrap{overflow-x:auto}
  .edit-row{flex-direction:column;gap:8px}
  .fld{width:100%}
  .fld select{width:100%}
  .sp-head{flex-direction:column;align-items:flex-start}
}
</style>
</head>

    syu:{月:['08:00','17:00'],火:['08:00','17:00'],水:['08:00','17:00'],木:['08:00','17:00'],金:['08:00','17:00'],土:null,日:null},
    sakamoto:{月:['12:00','21:00'],火:['12:00','21:00'],水:null,木:null,金:['12:00','21:00'],土:['12:00','21:00'],日:['12:00','21:00']},
    yoshimoto:{月:null,火:null,水:null,木:null,金:null,土:null,日:null},
    togari:{月:null,火:null,水:null,木:null,金:null,土:null,日:null},
  },
  parts:{月:[],火:[],水:[],木:[],金:[],土:[],日:[]},
  memos:{月:'',火:'',水:'',木:'',金:'',土:'',日:''},
};
let data={weekly:null,special:{},specialMemos:{}};

function loadData(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){data=JSON.parse(r);if(!data.weekly)data.weekly=JSON.parse(JSON.stringify(DEF_WEEKLY));if(!data.special)data.special={};if(!data.specialMemos)data.specialMemos={};if(!data.weekly.memos)data.weekly.memos={月:'',火:'',水:'',木:'',金:'',土:'',日:''};}
    else{data.weekly=JSON.parse(JSON.stringify(DEF_WEEKLY));data.special={};data.specialMemos={};}
  }catch(e){data.weekly=JSON.parse(JSON.stringify(DEF_WEEKLY));data.special={};data.specialMemos={};}
}
let saveTimer;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
      const el=document.getElementById('savePill');
      el.textContent='保存しました ✓';el.className='save-pill ok';
      setTimeout(()=>{el.textContent='自動保存';el.className='save-pill';},2000);
    }catch(e){}
  },300);
}

// ============================================================
// CONSTANTS
// ============================================================
const HS=8,HE=24,HR=HE-HS;
const RED_H=[11,15];
const ALL_H=[];for(let h=HS;h<=HE;h++)ALL_H.push(h);
const CN='#534AB7',CD='#D4537E',CM='#1D9E75';
let curMode='weekly',curDay='月',calYear,calMonth,selectedDate=null,editing=null,editCtx=null;
let nowLineTimer=null;

function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function pct(h){return((h-HS)/HR*100).toFixed(3)+'%'}
function stype(s){const m=toMin(s);return m>=toMin('22:00')?'night':m<toMin('11:00')?'day':'mid'}
function bcolor(s){const t=stype(s);return t==='night'?CN:t==='day'?CD:CM}
function bgeom(s,e){
  const sm=toMin(s),em=toMin(e);
  let sh=sm/60,eh=em/60;
  if(sm>=toMin('22:00'))eh=em/60+24;else if(em<sm)eh=em/60+24;
  const sc=Math.max(sh,HS),ec=Math.min(eh,HE);
  return{l:((sc-HS)/HR*100).toFixed(3)+'%',w:((ec-sc)/HR*100).toFixed(3)+'%'};
}
function dk(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}

// ============================================================
// NOW LINE
// ============================================================
function nowPct(){
  const n=new Date();
  const h=n.getHours()+n.getMinutes()/60;
  if(h<HS||h>HE)return null;
  return((h-HS)/HR*100).toFixed(3)+'%';
}
function nowLabel(){
  const n=new Date();
  return`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
}
function updateNowLines(){
  const p=nowPct();
  document.querySelectorAll('.now-line').forEach(el=>{
    el.style.display=p?'':'none';
    if(p)el.style.left=p;
  });
  document.querySelectorAll('.now-line-axis').forEach(el=>{
    el.style.display=p?'':'none';
    if(p)el.style.left=p;
  });
  document.querySelectorAll('.now-time-label').forEach(el=>{
    el.style.display=p?'':'none';
    if(p){el.style.left=p;el.textContent=nowLabel();}
  });
}
function startNowTimer(){
  if(nowLineTimer)clearInterval(nowLineTimer);
  nowLineTimer=setInterval(updateNowLines,30000);
}

// ============================================================
// TICKS HTML
// ============================================================
function ticksHtml(includeNow){
  let h=ALL_H.map(hr=>{
    const isR=RED_H.includes(hr);
    return`<div style="position:absolute;top:0;bottom:0;left:${pct(hr)};width:${isR?'1.5px':'0.5px'};background:${isR?'#F09595':'#D3D1C7'};z-index:1;pointer-events:none"></div>`;
  }).join('');
  if(includeNow){
    const p=nowPct();
    if(p)h+=`<div class="now-line" style="left:${p};display:block"></div>`;
    else h+=`<div class="now-line" style="display:none"></div>`;
  }
  return h;
}

// ============================================================
// BUILD PANEL HTML
// ============================================================
function buildPanel(shiftsObj,partsArr,ctx){
  const parts=partsArr.map(p=>STAFF_PART.find(s=>s.id===p)).filter(Boolean);
  const np=nowPct(),nl=nowLabel();
  let html=`<div class="axis-row"><div class="name-col"></div><div class="axis-track">`;
  ALL_H.forEach(h=>{
    const isR=RED_H.includes(h);
    html+=`<span class="tick-label" style="left:${pct(h)};color:${isR?'#E24B4A':'#888780'};font-weight:${isR?700:400}">${h===24?'0':h}</span>`;
  });
  if(np)html+=`<div class="now-line-axis" style="left:${np}"></div><div class="now-time-label" style="left:${np}">${nl}</div>`;
  html+=`</div></div>`;

  function row(st){
    const sh=shiftsObj[st.id],working=sh!=null;
    let r=`<div class="staff-row"><div class="name-cell ${working?'working':'off'}">`;
    r+=`<span class="n1">${st.l1}</span>`;
    if(st.l2)r+=`<span class="n2">${st.l2}</span>`;
    if(st.type==='part')r+=`<span class="nbadge">バイト</span>`;
    r+=`</div><div class="timeline">${ticksHtml(true)}`;
    if(working){
      const[s,e]=sh,g=bgeom(s,e),bc=bcolor(s);
      r+=`<div class="bar" style="left:${g.l};width:${g.w};background:${bc}" onclick="startEdit('${st.id}','${ctx}')"><span class="blabel">${s}〜${e}</span></div>`;
    }else{
      r+=`<div class="off-cell" style="cursor:pointer" onclick="startEdit('${st.id}','${ctx}')"><div class="off-tag" style="pointer-events:none">休み　＋</div></div>`;
    }
    return r+`</div></div>`;
  }

  STAFF_FULL.forEach(st=>{html+=row(st);});
  if(parts.length){html+=`<div class="section-div">バイト</div>`;parts.forEach(st=>{html+=row(st);});}

  // count
  const allA=[...STAFF_FULL,...parts];
  html+=`<div class="count-row"><div class="count-name">在勤人数</div><div class="count-track">`;
  for(let h=HS;h<HE;h++){
    let cnt=0;
    allA.forEach(st=>{
      const sh=shiftsObj[st.id];if(!sh)return;
      const[s,e]=sh,sm=toMin(s),em=toMin(e),hm=h*60;
      if(sm>=toMin('22:00')?hm>=sm||hm<em:hm>=sm&&hm<em)cnt++;
    });
    if(cnt>0){
      const left=((h-HS)/HR*100).toFixed(3)+'%',width=(1/HR*100).toFixed(3)+'%';
      const bg=cnt>=3?'#E24B4A':cnt===2?'#EF9F27':'#378ADD';
      const tc=cnt>=3?'#fff':cnt===2?'#412402':'#042C53';
      html+=`<div class="count-seg" style="left:${left};width:${width};background:${bg};color:${tc}">${cnt}</div>`;
    }
  }
  html+=`</div></div>`;
  return html;
}

// ============================================================
// WEEKLY
// ============================================================
function renderDayTabs(){
  document.getElementById('dayTabs').innerHTML=DAYS.map((d,i)=>{
    const c=DAY_COLORS[i],active=d===curDay;
    const style=active?`background:${c.bg};color:#fff;border-color:${c.bg}`:`background:${c.lt};color:${c.bg};border-color:${c.bg}88`;
    return`<div class="dtab" style="${style}" onclick="setDay('${d}')">${d}</div>`;
  }).join('');
}
function renderWeeklyPanel(){
  const ds={};ALL_STAFF.forEach(st=>{ds[st.id]=data.weekly.shifts[st.id][curDay];});
  document.getElementById('mainPanel').innerHTML=buildPanel(ds,data.weekly.parts[curDay],'weekly');
  updateAddBar('weekly');
  // memo
  document.getElementById('memoLabel').textContent=`メモ（${curDay}曜日）`;
  const mv=data.weekly.memos[curDay]||'';
  document.getElementById('weeklyMemo').value=mv;
  document.getElementById('weeklyMemoCount').textContent=`${mv.length}文字`;
  updateNowLines();
}
function setDay(d){curDay=d;resetEdit();renderDayTabs();renderWeeklyPanel();}

function saveMemoWeekly(){
  const v=document.getElementById('weeklyMemo').value;
  data.weekly.memos[curDay]=v;
  document.getElementById('weeklyMemoCount').textContent=`${v.length}文字`;
  saveData();
}

// ============================================================
// CALENDAR
// ============================================================
function renderCalendar(){
  const now=new Date();
  document.getElementById('calMonthLabel').textContent=`${calYear}年 ${calMonth}月`;
  const grid=document.getElementById('calGrid');
  const dows=['月','火','水','木','金','土','日'];
  let html=dows.map((d,i)=>`<div class="cal-dow${i===5?' sat':i===6?' sun':''}">${d}</div>`).join('');
  const first=new Date(calYear,calMonth-1,1);
  let sd=first.getDay();sd=sd===0?6:sd-1;
  const dim=new Date(calYear,calMonth,0).getDate();
  const dipm=new Date(calYear,calMonth-1,0).getDate();
  const todayK=dk(now.getFullYear(),now.getMonth()+1,now.getDate());
  let cells=[];
  for(let i=0;i<sd;i++)cells.push({d:dipm-sd+1+i,other:true,prev:true});
  for(let i=1;i<=dim;i++)cells.push({d:i,other:false});
  while(cells.length%7!==0)cells.push({d:cells.length-sd-dim+1,other:true});
  cells.forEach(cell=>{
    const y=cell.other?(cell.prev?(calMonth===1?calYear-1:calYear):(calMonth===12?calYear+1:calYear)):calYear;
    const m=cell.other?(cell.prev?(calMonth===1?12:calMonth-1):(calMonth===12?1:calMonth+1)):calMonth;
    const key=dk(y,m,cell.d);
    const d=new Date(key+'T00:00:00'),dow=d.getDay();
    const isToday=key===todayK,isSel=key===selectedDate,hasSp=!!data.special[key],hasMemo=!!(data.specialMemos[key]&&data.specialMemos[key].length);
    const hol=JP_HOL[key],isSat=dow===6,isSun=dow===0;
    let cls='cal-day';
    if(cell.other)cls+=' other-month';
    if(isToday)cls+=' today';
    if(isSel)cls+=' selected';
    if(hasSp)cls+=' has-special';
    if(hasMemo)cls+=' has-memo';
    let numCls='dnum'+(isSat?' sat':isSun||hol?' hol':'');
    let mini='';
    if(!cell.other){
      const dayName=DAYS[dow===0?6:dow-1];
      const ws=hasSp?data.special[key].shifts:data.weekly.shifts;
      const wp=hasSp?data.special[key].parts:data.weekly.parts[dayName];
      const working=[...STAFF_FULL,...(wp||[]).map(p=>STAFF_PART.find(s=>s.id===p)).filter(Boolean)]
        .filter(st=>hasSp?ws[st.id]:ws[st.id][dayName]);
      if(working.length){
        mini='<div class="shift-mini">';
        working.slice(0,2).forEach(st=>{
          const sh=hasSp?ws[st.id]:ws[st.id][dayName];
          if(sh)mini+=`<div class="shift-chip" style="background:${bcolor(sh[0])}">${st.l1}</div>`;
        });
        if(working.length>2)mini+=`<div class="shift-chip" style="background:#888780">+${working.length-2}</div>`;
        mini+='</div>';
      }
    }
    html+=`<div class="${cls}" onclick="selectDate('${key}')">`;
    html+=`<div class="${numCls}">${cell.d}</div>`;
    if(hol&&!cell.other)html+=`<div class="hol-label">${hol}</div>`;
    if(hasSp&&!cell.other)html+=`<div class="sdot"></div>`;
    html+=mini+'</div>';
  });
  grid.innerHTML=html;
}
function prevMonth(){calMonth--;if(calMonth<1){calMonth=12;calYear--;}renderCalendar();}
function nextMonth(){calMonth++;if(calMonth>12){calMonth=1;calYear++;}renderCalendar();}
function selectDate(key){selectedDate=key;resetEdit();renderCalendar();renderSpecialPanel();}

function getSpecialShifts(key){
  if(data.special[key])return data.special[key];
  const d=new Date(key+'T00:00:00'),dow=d.getDay(),dn=DAYS[dow===0?6:dow-1];
  const ws=data.weekly.shifts,wp=data.weekly.parts[dn];
  const snap={};ALL_STAFF.forEach(st=>{snap[st.id]=ws[st.id][dn]?[...ws[st.id][dn]]:null;});
  return{shifts:snap,parts:[...wp],_fw:true};
}
function ensureSpecial(key){
  if(!data.special[key]){const b=getSpecialShifts(key);data.special[key]={shifts:b.shifts,parts:b.parts};}
}
function renderSpecialPanel(){
  if(!selectedDate){document.getElementById('specialShiftPanel').style.display='none';return;}
  document.getElementById('specialShiftPanel').style.display='';
  const d=new Date(selectedDate+'T00:00:00'),dow=d.getDay(),dn=DAYS[dow===0?6:dow-1];
  const hol=JP_HOL[selectedDate],isSp=!!data.special[selectedDate];
  const[y,m,dd]=selectedDate.split('-');
  document.getElementById('specialDateTitle').textContent=`${parseInt(y)}年${parseInt(m)}月${parseInt(dd)}日（${dn}）${hol?'　'+hol:''}`;
  document.getElementById('specialBadge').style.display=isSp?'':'none';
  document.getElementById('clearSpecialBtn').style.display=isSp?'':'none';
  document.getElementById('copyFromBtns').innerHTML=DAYS.map(d=>`<button class="copy-btn" onclick="copyFromDay('${d}')">${d}</button>`).join('');
  const src=getSpecialShifts(selectedDate);
  document.getElementById('specialPanel').innerHTML=buildPanel(src.shifts,src.parts,'special');
  updateAddBar('special');
  // memo
  document.getElementById('specialMemoLabel').textContent=`メモ（${parseInt(m)}/${parseInt(dd)}）`;
  const mv=data.specialMemos[selectedDate]||'';
  document.getElementById('specialMemo').value=mv;
  document.getElementById('specialMemoCount').textContent=`${mv.length}文字`;
  updateNowLines();
}
function copyFromDay(dn){
  ensureSpecial(selectedDate);
  const ws=data.weekly.shifts,wp=data.weekly.parts[dn];
  ALL_STAFF.forEach(st=>{data.special[selectedDate].shifts[st.id]=ws[st.id][dn]?[...ws[st.id][dn]]:null;});
  data.special[selectedDate].parts=[...wp];
  saveData();renderSpecialPanel();renderCalendar();
}
function clearSpecial(){
  if(!confirm('この日の特定シフトを削除しますか？'))return;
  delete data.special[selectedDate];
  saveData();renderSpecialPanel();renderCalendar();resetEdit();
}
function saveMemoSpecial(){
  if(!selectedDate)return;
  const v=document.getElementById('specialMemo').value;
  data.specialMemos[selectedDate]=v;
  document.getElementById('specialMemoCount').textContent=`${v.length}文字`;
  saveData();renderCalendar();
}

// ============================================================
// ADD PART
// ============================================================
function addPart(mode){
  if(mode==='weekly'){
    const sid=document.getElementById('partSelectWeekly').value;
    if(!data.weekly.parts[curDay].includes(sid)){data.weekly.parts[curDay].push(sid);if(!data.weekly.shifts[sid][curDay])data.weekly.shifts[sid][curDay]=['10:00','17:00'];}
    saveData();renderWeeklyPanel();
  }else{
    if(!selectedDate)return;
    ensureSpecial(selectedDate);
    const sid=document.getElementById('partSelectSpecial').value;
    if(!data.special[selectedDate].parts.includes(sid)){data.special[selectedDate].parts.push(sid);if(!data.special[selectedDate].shifts[sid])data.special[selectedDate].shifts[sid]=['10:00','17:00'];}
    saveData();renderSpecialPanel();renderCalendar();
  }
}
function updateAddBar(mode){
  const sel=document.getElementById(mode==='weekly'?'partSelectWeekly':'partSelectSpecial');
  const active=mode==='weekly'?data.weekly.parts[curDay]:(selectedDate&&data.special[selectedDate]?data.special[selectedDate].parts:[]);
  Array.from(sel.options).forEach(opt=>{
    const st=STAFF_PART.find(s=>s.id===opt.value);
    opt.disabled=active.includes(opt.value);
    opt.text=opt.disabled?`${st.l1} ${st.l2} (済)`:`${st.l1} ${st.l2}`;
  });
}

// ============================================================
// EDIT
// ============================================================
const TIMES=[];
for(let h=0;h<24;h++)for(const m of[0,30])TIMES.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);

function startEdit(sid,ctx){
  editing=sid;editCtx=ctx;
  const st=ALL_STAFF.find(s=>s.id===sid);
  const sh=ctx==='weekly'?data.weekly.shifts[sid][curDay]:getSpecialShifts(selectedDate).shifts[sid];
  document.getElementById('editHead').textContent=`${st.l1} ${st.l2||''} — ${ctx==='weekly'?curDay+'曜日':selectedDate}`;
  let html=`<div class="edit-row"><div class="fld"><label>ステータス</label><select onchange="chStatus(this.value)"><option value="work"${sh?' selected':''}>勤務</option><option value="off"${!sh?' selected':''}>休み</option></select></div>`;
  if(sh){
    const[s,e]=sh,sm=toMin(s),em=toMin(e),diff=em>sm?em-sm:24*60-sm+em;
    const tp=stype(s),lbl=tp==='night'?'夜勤':tp==='day'?'日勤':'昼番',col=bcolor(s);
    html+=`<div class="fld"><label>種別</label><div class="typebadge" style="background:${col}">${lbl}</div></div>`;
    html+=`<div class="fld"><label>開始</label><select onchange="chStart(this.value)">`;
    TIMES.forEach(t=>{html+=`<option${t===s?' selected':''}>${t}</option>`;});
    html+=`</select></div><div class="fld"><label>終了</label><select onchange="chEnd(this.value)">`;
    TIMES.forEach(t=>{html+=`<option${t===e?' selected':''}>${t}</option>`;});
    html+=`</select></div><div class="fld"><label>合計</label><div class="dur">${(diff/60).toFixed(1)}h</div></div>`;
  }
  html+=`</div>`;
  if(st.type==='part')html+=`<button class="remove-btn" onclick="removePart('${sid}')">この日から削除</button>`;
  html+=`<div class="hint-txt">変更は自動保存されます</div>`;
  document.getElementById('editBody').innerHTML=html;
}
function getES(){return editCtx==='weekly'?data.weekly.shifts[editing][curDay]:(ensureSpecial(selectedDate),data.special[selectedDate].shifts[editing]);}
function setES(v){if(editCtx==='weekly'){data.weekly.shifts[editing][curDay]=v;}else{ensureSpecial(selectedDate);data.special[selectedDate].shifts[editing]=v;}}
function chStatus(v){if(!editing)return;setES(v==='work'?['09:00','17:00']:null);saveData();rerender();startEdit(editing,editCtx);}
function chStart(v){if(!editing)return;const sh=getES();if(!sh)return;sh[0]=v;saveData();rerender();startEdit(editing,editCtx);}
function chEnd(v){if(!editing)return;const sh=getES();if(!sh)return;sh[1]=v;saveData();rerender();startEdit(editing,editCtx);}
function removePart(sid){
  if(editCtx==='weekly'){data.weekly.parts[curDay]=data.weekly.parts[curDay].filter(x=>x!==sid);data.weekly.shifts[sid][curDay]=null;}
  else{ensureSpecial(selectedDate);data.special[selectedDate].parts=data.special[selectedDate].parts.filter(x=>x!==sid);data.special[selectedDate].shifts[sid]=null;}
  saveData();rerender();resetEdit();
}
function rerender(){if(editCtx==='weekly')renderWeeklyPanel();else{renderSpecialPanel();renderCalendar();}}
function resetEdit(){editing=null;editCtx=null;document.getElementById('editHead').textContent='シフトバーをクリックして編集';document.getElementById('editBody').innerHTML='<div class="hint-txt">スタッフのバーをクリックすると時間を変更できます</div>';}

// ============================================================
// MODE
// ============================================================
function setMode(m){
  curMode=m;
  document.getElementById('modeWeekly').className='mode-tab'+(m==='weekly'?' active':'');
  document.getElementById('modeCalendar').className='mode-tab'+(m==='calendar'?' active':'');
  document.getElementById('weeklyBlock').style.display=m==='weekly'?'':'none';
  document.getElementById('calendarBlock').style.display=m==='calendar'?'':'none';
  resetEdit();
  if(m==='calendar')renderCalendar();
}

// ============================================================
// PRINT
// ============================================================
function doPrint(){
  window.print();
}

// ============================================================
// SPLASH
// ============================================================
(function(){
  const splash=document.getElementById('splash');
  setTimeout(()=>{
    splash.classList.add('hide');
    setTimeout(()=>{splash.style.display='none';},1500);
  },3200);
  // Fallback: force hide after 5s
  setTimeout(()=>{splash.style.display='none';},5000);
})();

// ============================================================
// INIT
// ============================================================
loadData();
const now=new Date();
calYear=now.getFullYear();calMonth=now.getMonth()+1;
renderDayTabs();
renderWeeklyPanel();
startNowTimer();
</script>

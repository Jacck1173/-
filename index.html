*{box-sizing:border-box;margin:0;padding:0}

/* ===== SPLASH SCREEN ===== */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:#0E0E0C;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  pointer-events:none;
  overflow:hidden;
}
#splash.hide{
  animation:splashFadeOut 1.4s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes splashFadeOut{
  0%{opacity:1;transform:scale(1)}
  40%{opacity:1;transform:scale(1.018)}
  100%{opacity:0;transform:scale(1.04)}
}

/* horizontal wipe lines top & bottom */
.splash-line-top{
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,transparent,#B8A98A 30%,#B8A98A 70%,transparent);
  transform:scaleX(0);transform-origin:center;
  animation:lineWipe 1s cubic-bezier(.4,0,.2,1) forwards;
  animation-delay:.2s;
}
.splash-line-bottom{
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(to right,transparent,#B8A98A 30%,#B8A98A 70%,transparent);
  transform:scaleX(0);transform-origin:center;
  animation:lineWipe 1s cubic-bezier(.4,0,.2,1) forwards;
  animation-delay:.2s;
}
@keyframes lineWipe{to{transform:scaleX(1)}}

/* logo */
.splash-logo{
  width:clamp(220px,45vw,380px);
  opacity:0;
  animation:logoReveal 1.2s cubic-bezier(.2,0,.2,1) forwards;
  animation-delay:.6s;
  filter:drop-shadow(0 0 30px rgba(184,169,138,.15));
}
@keyframes logoReveal{
  0%{opacity:0;transform:scale(.94) translateY(16px)}
  60%{opacity:1;transform:scale(1.01) translateY(-2px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}

/* shimmer sweep over logo */
.splash-shimmer{
  position:absolute;
  width:60px;height:100%;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.07) 50%,transparent 60%);
  left:-80px;
  animation:shimmerSweep 1.6s ease forwards;
  animation-delay:1.4s;
  pointer-events:none;
}
@keyframes shimmerSweep{
  to{left:110%}
}

.splash-tagline{
  font-family:'Noto Sans JP',sans-serif;
  font-size:10px;font-weight:300;letter-spacing:.5em;
  color:#4A4844;text-transform:uppercase;
  opacity:0;margin-top:28px;
  animation:fadeUp .8s ease forwards;
  animation-delay:1.2s;
}

/* grain overlay */
#splash::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.045'/%3E%3C/svg%3E");
  background-size:180px;pointer-events:none;opacity:.5;z-index:0;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

function renderSpecialPanel(){
  if(!selectedDate){
    document.getElementById('specialShiftPanel').style.display='none';
    return;
  }
  document.getElementById('specialShiftPanel').style.display='';
  const d=new Date(selectedDate+'T00:00:00');
  const dow=d.getDay();
  const dayName=DAYS[dow===0?6:dow-1];
  const holiday=JP_HOLIDAYS[selectedDate];
  const isSpecial=!!data.special[selectedDate];

  // title
  const [y,m,dd]=selectedDate.split('-');
  document.getElementById('specialDateTitle').textContent=`${parseInt(y)}年${parseInt(m)}月${parseInt(dd)}日（${dayName}）${holiday?'　'+holiday:''}`;
  document.getElementById('specialBadge').style.display=isSpecial?'':'none';
  document.getElementById('clearSpecialBtn').style.display=isSpecial?'':'none';

  // copy buttons
  let copyHtml='';
  DAYS.forEach(d=>{
    copyHtml+=`<button class="copy-btn" onclick="copyFromDay('${d}')">${d}曜をコピー</button>`;
  });
  document.getElementById('copyFromBtns').innerHTML=copyHtml;

  const src=getSpecialShifts(selectedDate);
  document.getElementById('specialPanel').innerHTML=buildPanelHtml(src.shifts, src.parts, 'special');
  updateAddBar('special');
}

function copyFromDay(dayName){
  ensureSpecial(selectedDate);
  const ws=data.weekly.shifts;
  const wp=data.weekly.parts[dayName];
  ALL_STAFF.forEach(st=>{
    data.special[selectedDate].shifts[st.id]=ws[st.id][dayName]?[...ws[st.id][dayName]]:null;
  });
  data.special[selectedDate].parts=[...wp];
  saveData(); renderSpecialPanel(); renderCalendar();
}

function clearSpecial(){
  if(!confirm('この日の特定シフトを削除しますか？通常シフト（曜日）に戻ります。'))return;
  delete data.special[selectedDate];
  saveData(); renderSpecialPanel(); renderCalendar(); resetEdit();
}

// ===================== ADD PART =====================
function addPart(mode){
  if(mode==='weekly'){
    const sid=document.getElementById('partSelectWeekly').value;
    if(!data.weekly.parts[curDay].includes(sid)){
      data.weekly.parts[curDay].push(sid);
      if(!data.weekly.shifts[sid][curDay]) data.weekly.shifts[sid][curDay]=['10:00','17:00'];
    }
    saveData(); renderWeeklyPanel();
  } else {
    if(!selectedDate)return;
    ensureSpecial(selectedDate);
    const sid=document.getElementById('partSelectSpecial').value;
    if(!data.special[selectedDate].parts.includes(sid)){
      data.special[selectedDate].parts.push(sid);
      if(!data.special[selectedDate].shifts[sid]) data.special[selectedDate].shifts[sid]=['10:00','17:00'];
    }
    saveData(); renderSpecialPanel(); renderCalendar();
  }
}

// ===================== EDIT =====================
const TIMES=[];
for(let h=0;h<24;h++) for(const m of[0,30]) TIMES.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);

function startEdit(sid, context){
  editing=sid; editingContext=context;
  const st=ALL_STAFF.find(s=>s.id===sid);
  let sh;
  if(context==='weekly'){
    sh=data.weekly.shifts[sid][curDay];
  } else {
    const src=getSpecialShifts(selectedDate);
    sh=src.shifts[sid];
  }
  document.getElementById('editHead').textContent=`${st.l1} ${st.l2||''} — ${context==='weekly'?curDay+'曜日':selectedDate}`;
  let html=`<div class="edit-row"><div class="fld"><label>ステータス</label><select onchange="chStatus(this.value)">`;
  html+=`<option value="work"${sh?' selected':''}>勤務</option><option value="off"${!sh?' selected':''}>休み</option></select></div>`;
  if(sh){
    const[s,e]=sh,sm=toMin(s),em=toMin(e),diff=em>sm?em-sm:24*60-sm+em;
    const type=getShiftType(s),label=type==='night'?'夜勤':type==='day'?'日勤':'昼番',color=barColor(s);
    html+=`<div class="fld"><label>種別</label><div class="typebadge" style="background:${color}">${label}</div></div>`;
    html+=`<div class="fld"><label>開始</label><select onchange="chStart(this.value)">`;
    TIMES.forEach(t=>{html+=`<option${t===s?' selected':''}>${t}</option>`;});
    html+=`</select></div><div class="fld"><label>終了</label><select onchange="chEnd(this.value)">`;
    TIMES.forEach(t=>{html+=`<option${t===e?' selected':''}>${t}</option>`;});
    html+=`</select></div><div class="fld"><label>合計</label><div class="dur">${(diff/60).toFixed(1)}h</div></div>`;
  }
  html+=`</div>`;
  if(st.type==='part') html+=`<button class="remove-btn" onclick="removePart('${sid}')">この日から削除</button>`;
  html+=`<div class="hint-txt">変更は自動保存されます</div>`;
  document.getElementById('editBody').innerHTML=html;
}

function getEditShift(){
  if(editingContext==='weekly') return data.weekly.shifts[editing][curDay];
  ensureSpecial(selectedDate);
  return data.special[selectedDate].shifts[editing];
}
function setEditShift(val){
  if(editingContext==='weekly'){
    data.weekly.shifts[editing][curDay]=val;
  } else {
    ensureSpecial(selectedDate);
    data.special[selectedDate].shifts[editing]=val;
  }
}

function chStatus(v){
  if(!editing)return;
  setEditShift(v==='work'?['09:00','17:00']:null);
  saveData(); rerender(); startEdit(editing,editingContext);
}
function chStart(v){
  if(!editing)return;
  const sh=getEditShift(); if(!sh)return;
  sh[0]=v; saveData(); rerender(); startEdit(editing,editingContext);
}
function chEnd(v){
  if(!editing)return;
  const sh=getEditShift(); if(!sh)return;
  sh[1]=v; saveData(); rerender(); startEdit(editing,editingContext);
}
function removePart(sid){
  if(editingContext==='weekly'){
    data.weekly.parts[curDay]=data.weekly.parts[curDay].filter(x=>x!==sid);
    data.weekly.shifts[sid][curDay]=null;
  } else {
    ensureSpecial(selectedDate);
    data.special[selectedDate].parts=data.special[selectedDate].parts.filter(x=>x!==sid);
    data.special[selectedDate].shifts[sid]=null;
  }
  saveData(); rerender(); resetEdit();
}
function rerender(){
  if(editingContext==='weekly'){ renderWeeklyPanel(); }
  else { renderSpecialPanel(); renderCalendar(); }
}
function resetEdit(){
  editing=null; editingContext=null;
  document.getElementById('editHead').textContent='シフトバーをクリックして編集';
  document.getElementById('editBody').innerHTML='<div class="hint-txt">スタッフのバーをクリックすると時間を変更できます</div>';
}
